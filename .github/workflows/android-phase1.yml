name: Hermes Android Phase 1
on:
  push:
    branches: [hermes-android/phase-1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hermes-phase1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host-and-arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'
      - name: Record source and host identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/port-commit.txt
          git -C vendor/hermes rev-parse HEAD > evidence/upstream-commit.txt
          python3.14 --version > evidence/host-python.txt
          uname -a > evidence/host-platform.txt
          printf '%s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > evidence/run-url.txt
      - name: Linux host tests (not Android tests)
        run: bash scripts/run_host_tests.sh
      - name: Inspect exact dependency candidates
        if: always()
        run: python3.14 scripts/probe_dependencies.py
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build real ARM64 debug APK and instrumentation APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee evidence/android-build.log
      - name: Record APK size and checksums
        run: python3.14 scripts/apk_evidence.py
      - name: Upload APKs only when the build produced them
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-phase1-arm64-apks
          path: |
            app/build/outputs/apk/**/*.apk
            evidence/apk-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload actual evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-phase1-evidence
          path: |
            evidence/
            app/build/generated/assets/source-manifest.json
          if-no-files-found: error
          retention-days: 30
